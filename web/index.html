<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HeatCharting · NSE liquidity heatmap</title>
  </head>
  <body>
    <header class="bar">
      <div class="brand">Heat<span>Charting</span><em>NSE</em></div>
      <div class="search">
        <input id="q" type="search" placeholder="Search NSE symbol or company" autocomplete="off" spellcheck="false" />
        <ul id="results" hidden></ul>
      </div>
      <div class="quote"><b id="sym">-</b><span id="ltp">-</span><span id="chg"></span></div>
      <div class="status"><span id="note"></span><span id="dot"></span><span id="status">Starting...</span></div>
    </header>
    <nav id="toolbar" class="toolbar"></nav>
    <main>
      <section class="stage">
        <div id="tools" class="drawtools"></div>
        <div class="stagebody">
        <div id="grid" class="grid g1"></div>
        <div class="bottombar">
          <div id="ranges" class="ranges"></div>
          <div class="bb-right">
            <span id="mkt" class="mkt"></span>
            <span id="clock" class="clock"></span>
            <button id="scPct" type="button" class="sc" title="Percentage price scale">%</button>
            <button id="scLog" type="button" class="sc" title="Logarithmic price scale">log</button>
            <button id="scAuto" type="button" class="sc" title="Fit the price scale to the data automatically">auto</button>
          </div>
        </div>
        <div id="replayBar" class="replay" hidden>
          <button id="rwBack" type="button" title="Back one bar">&#9664;&#9664;</button>
          <button id="rwPlay" type="button" title="Play or pause">&#9654;</button>
          <button id="rwFwd" type="button" title="Forward one bar">&#9654;&#9654;</button>
          <select id="rwSpeed" title="Bars per second"><option value="1">1x</option><option value="2">2x</option><option value="5">5x</option><option value="10">10x</option><option value="30">30x</option></select>
          <input id="rwSlider" type="range" min="1" max="100" value="1" />
          <span id="rwTime">-</span>
          <button id="rwExit" type="button">Exit replay</button>
        </div>
        </div>
      </section>
      <aside id="dock" class="dock">
        <section class="dp ladder" data-p="book">
        <h2>Order book <small>best 5</small></h2>
        <div id="asks"></div>
        <div id="mid">-</div>
        <div id="bids"></div>
        <h2 class="log-h">Walls <small>large orders</small></h2>
        <ul id="wallLog"><li class="empty">None yet. A wall is an order several times the usual size.</li></ul>
        <p class="note">Angel One shows the five best bids and asks. Brighter bands in the chart mean more shares resting at that price.</p>
        </section>
        <section class="dp ladder" data-p="watch" hidden></section>
        <section class="dp ladder" data-p="alerts" hidden></section>
        <section class="dp ladder" data-p="data" hidden></section>
        <section class="dp ladder" data-p="objects" hidden></section>
      </aside>
      <nav id="rail" class="rail"></nav>
    </main>
    <div id="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
